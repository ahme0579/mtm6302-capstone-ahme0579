<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Pokedex</title>
</head>

<body>
  <header id="header">
    <img src="images/frames/header.svg" alt="">
  </header>
  <main class="container">
    <div class="frame-outline">
      <img src="images/frames/outline.svg" alt="">
    </div>
    <section class="left">
      <div class="content">
        <div class="inner">
          <div class="header">
            <h1>Pokedex</h1>

          </div>
          <div class="gallery"></div>
          <button id="load-more" aria-label="Load More">
            &#9660;
          </button>
        </div>
      </div>
    </section>
    <div class="divider">
      <img src="images/frames/divider.svg" alt="">
    </div>
    <section class="right">
      <div class="content">
        <div class="display">
          <img src="images/frames/display.svg" alt="">
          <div class="inner">
            <img class="pokemon-image" src="" alt="">
            <h2 class="name"></h2>
            <span class="tag"></span>
          </div>
          <button class="catch-btn">
            <img src="images/icons/catch-50_x_50.png" alt="">
            <span></span>
          </button>
          <button class="release-btn">
            <img src="images/icons/release-50_x_50.png" alt="">
            <span></span>
          </button>

        </div>
        <div class="instructions-card">
          <img src="images/frames/caught.svg" alt="" />
          <div class="inner">
            <h3>Instructions</h3>
            <p>Click on a pokemon to view details</p>
            <p>Catch the pokemon using the pokeball to view caught pokemon in gallery</p>
            <p>Release the pokemon using the release ball</p>
          </div>
        </div>
      </div>

    </section>

  </main>
  <script src="script.js"></script>
</body>

</html>
