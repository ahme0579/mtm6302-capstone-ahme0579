<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
  <title>Pokedex</title>
</head>

<body>
  <header id="header">
    <img src="images/frames/header.svg" alt="" />
  </header>
  <main class="container">
    <div class="frame-outline">
      <img src="images/frames/outline.svg" alt="" />
    </div>
    <section class="left">
      <div class="content">
        <div class="inner">
          <div class="header">
            <h1>Pokedex</h1>
            <p>Gen 1</p>
          </div>

          <div class="gallery">
            <div class="item"><img src="images/pokemon/1x/Asset 9.png"></div>
            <div class="item"><img src="images/pokemon/1x/Asset 8.png"></div>
            <div class="item"><img src="images/pokemon/1x/Asset 7.png"></div>
            <div class="item"><img src="images/pokemon/1x/Asset 6.png"></div>
            <div class="item"><img src="images/pokemon/1x/Asset 5.png"></div>
            <div class="item"><img src="images/pokemon/1x/Asset 4.png"></div>
            <div class="item"><img src="images/pokemon/1x/Asset 3.png"></div>
            <div class="item"><img src="images/pokemon/1x/Asset 9.png"></div>
          </div>
        </div>
      </div>
    </section>
    <div class="divider">
      <img src="images/frames/divider.svg" alt="" />
    </div>
    <section class="right">
      <div class="content">
        <div class="display">
          <button class="catch-btn">
            <div class="icon">
              <!-- icon goes here -->
            </div>
            <span>Catch</span>
          </button>
          <img src="images/frames/display.svg" alt="" />
          <div class="inner">
            <img class="mewtwo" src="images/pokemon/1x/Asset 12.png">
            <h2 class="name">MEWTWO</h2>
            <span class="tag">PSYCHIC</span>
          </div>
        </div>
        <div class="caught-card">
          <img src="images/frames/caught.svg" alt="" />
          <div class="inner">
            <div class="item"></div>
            <div class="item"></div>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>

</html>
